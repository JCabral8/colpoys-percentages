<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Colpoy's Percentages</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600&display=swap">
<style>
:root{
  --ground:#16110d; --panel:#231b14; --panel2:#2e2419; --line:#3d3025;
  --bone:#f3e9d8; --mute:#a3937f; --dim:#6e6153;
  --ember:#f0742a; --ember2:#ff9a4d; --gold:#e6b64f;
  --yes:#7cc47f; --no:#e0574f;
  --display:"Bebas Neue","Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Barlow","Helvetica Neue",Arial,sans-serif;
  --cond:"Barlow Condensed","Barlow",Arial,sans-serif;
}
*{box-sizing:border-box}
html{color-scheme:dark}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{margin:0;background:var(--ground);color:var(--bone);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(120% 60% at 50% 110%,rgba(240,116,42,.22),transparent 60%),radial-gradient(0px 0px at 12% 8%,rgba(243,233,216,.7),transparent 2px),radial-gradient(1px 1px at 28% 4%,rgba(243,233,216,.5),transparent 2px),radial-gradient(1.5px 1.5px at 47% 11%,rgba(243,233,216,.8),transparent 2px),radial-gradient(1px 1px at 63% 6%,rgba(243,233,216,.5),transparent 2px),radial-gradient(1px 1px at 78% 13%,rgba(243,233,216,.6),transparent 2px),radial-gradient(1.5px 1.5px at 90% 5%,rgba(243,233,216,.7),transparent 2px),radial-gradient(1px 1px at 84% 20%,rgba(243,233,216,.4),transparent 2px),radial-gradient(1px 1px at 5% 22%,rgba(243,233,216,.4),transparent 2px)}
.treeline{flex:0 0 auto;height:22px;margin-bottom:-4px;position:relative;z-index:1;pointer-events:none;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 34' preserveAspectRatio='none'><path fill='%230f0d0b' d='M0 34V22l6-9 5 7 3-11 4 8 5-13 6 12 4-6 5 10 4-14 5 9 6-16 6 13 4-5 5 8 5-12 5 10 4-7 5 12 6-17 6 14 4-6 5 9 5-13 5 11 4-4 6 9 5-15 6 12 4-7 5 10 5-11 6 13 3-5 5 8 5-12 5 10 4-7 5 12 6-17 6 14 4-6 5 9v14z'/></svg>") bottom/100% 100% no-repeat}
#app{position:relative;z-index:1;max-width:540px;margin:0 auto;height:100dvh;display:flex;flex-direction:column}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:4px 14px 16px}
header.top{display:flex;align-items:center;justify-content:space-between;padding:8px 14px 4px;gap:10px;flex:0 0 auto}
.logo{display:flex;align-items:center;gap:10px}
.logo svg{width:32px;height:32px;flex:0 0 auto}
.logo .wm{line-height:.9}
.logo .wm .a{font-family:var(--display);font-size:22px;letter-spacing:.04em;color:var(--bone);display:block;text-transform:uppercase}
.logo .wm .b{font-family:var(--cond);font-weight:600;font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--ember2);display:block;margin-top:2px}
.who{font-family:var(--cond);font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 10px;cursor:pointer;white-space:nowrap}
.who b{color:var(--gold)}
h2{font-family:var(--display);font-size:24px;letter-spacing:.03em;margin:10px 0 6px;line-height:1}
h3{font-family:var(--cond);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:18px 0 8px}
p{margin:6px 0}
.muted{color:var(--mute)}
.small{font-size:13px}
.navwrap{flex:0 0 auto;position:relative;z-index:5;background:#0f0d0b;padding:2px 0 max(6px,env(safe-area-inset-bottom))}
.navdial{position:relative;height:54px;max-width:540px;margin:0 auto;overflow:hidden;touch-action:pan-y;user-select:none;cursor:grab;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--panel)}
.navdial::before,.navdial::after{content:"";position:absolute;top:0;bottom:0;width:70px;z-index:3;pointer-events:none}
.navdial::before{left:0;background:linear-gradient(90deg,var(--ground),rgba(22,17,13,0))}
.navdial::after{right:0;background:linear-gradient(270deg,var(--ground),rgba(22,17,13,0))}
.navdial .ticks{position:absolute;left:0;right:0;top:0;height:10px;background-image:repeating-linear-gradient(90deg,var(--dim) 0 1px,transparent 1px 11px);background-repeat:repeat-x;background-size:110px 6px;background-position-y:0}
.navdial .ticks.major{height:10px;background-image:repeating-linear-gradient(90deg,var(--gold) 0 2px,transparent 2px 110px);background-size:110px 14px}
.navdial .ticks.bot{top:auto;bottom:0;transform:scaleY(-1)}
.navdial .it{position:absolute;top:0;left:50%;width:110px;margin-left:-55px;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding-top:6px;white-space:nowrap;font-family:var(--display);font-size:17px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);will-change:transform,opacity}
.navdial .it .ic{font-size:20px;line-height:1}
.navdial .it .hd{font-family:var(--cond);font-size:9px;letter-spacing:.16em;color:var(--dim);font-variant-numeric:tabular-nums}
.navdial .it.on{color:var(--bone)}
.navdial .it.on .hd{color:var(--ember2)}
.navdial .lub{position:absolute;left:50%;top:0;bottom:0;width:0;z-index:2;pointer-events:none}
.navdial .lub::before,.navdial .lub::after{content:"";position:absolute;left:-1px;width:2px;height:13px;background:var(--no);box-shadow:0 0 8px rgba(224,87,79,.8)}
.navdial .lub::before{top:0}
.navdial .lub::after{bottom:0}
.navdial .lubt{position:absolute;left:50%;top:0;margin-left:-7px;border-left:7px solid transparent;border-right:7px solid transparent;border-top:9px solid var(--no);z-index:2;pointer-events:none}
.navdial .win{position:absolute;top:0;bottom:0;left:50%;width:110px;margin-left:-55px;pointer-events:none;background:linear-gradient(90deg,rgba(240,116,42,0),rgba(240,116,42,.10),rgba(240,116,42,0))}
.navdial .chev{position:absolute;top:50%;transform:translateY(-50%);z-index:4;font-family:var(--display);font-size:26px;color:var(--gold);opacity:.8;pointer-events:none}
.navdial .chev.l{left:10px}.navdial .chev.r{right:10px}
.navdial .hint{position:absolute;left:50%;transform:translateX(-50%);bottom:3px;z-index:4;font-family:var(--cond);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#1a1205;background:var(--gold);border-radius:999px;padding:2px 10px;pointer-events:none;white-space:nowrap}
@keyframes nudgeL{0%,100%{transform:translate(0,-50%)}50%{transform:translate(-4px,-50%)}}
@keyframes nudgeR{0%,100%{transform:translate(0,-50%)}50%{transform:translate(4px,-50%)}}
.navdial.fresh .chev.l{animation:nudgeL 1.2s ease-in-out infinite}
.navdial.fresh .chev.r{animation:nudgeR 1.2s ease-in-out infinite}
.navlbl{max-width:540px;margin:0 auto;display:flex;justify-content:space-between;padding:2px 12px 0;font-family:var(--cond);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.btn{font-family:var(--cond);font-weight:600;font-size:16px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);background:var(--panel2);color:var(--bone);padding:12px 18px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--ember);border-color:var(--ember);color:#1a0d05}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1a1205}
.btn.ghost{background:transparent}
.btn.danger{border-color:var(--no);color:var(--no);background:transparent}
.btn.block{width:100%}
.btn.big{font-size:22px;padding:18px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.card.hot{border-color:var(--ember);box-shadow:0 0 0 1px rgba(240,116,42,.35),0 12px 40px rgba(240,116,42,.12)}
input[type=text],input[type=number],input[type=datetime-local],input[type=password],select,textarea{width:100%;background:var(--ground);border:1px solid var(--line);color:var(--bone);border-radius:8px;padding:12px;font:inherit;font-size:16px}
textarea{min-height:88px;resize:vertical}
label.f{display:block;font-family:var(--cond);font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:12px 0 6px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;background:var(--ground);border:0;color:var(--mute);padding:10px 4px;font-family:var(--cond);font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:13px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--panel2);color:var(--bone)}
.pill{display:inline-block;font-family:var(--cond);font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--mute)}
.pill.pct{color:var(--ember2);border-color:rgba(240,116,42,.5)}
.pill.num{color:var(--gold);border-color:rgba(230,182,79,.5)}
.pill.yes{color:var(--yes);border-color:rgba(124,196,127,.5)}
.pill.no{color:var(--no);border-color:rgba(224,87,79,.5)}
.pill.open{color:var(--mute)}
.pick-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.pick-grid button{font-family:var(--display);font-size:38px;letter-spacing:.04em;padding:28px 10px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--bone);cursor:pointer}
.pick-grid button:active{background:var(--panel2)}
.take-text{font-family:var(--display);font-size:34px;line-height:1.05;letter-spacing:.01em;text-wrap:balance;margin:6px 0 10px}
.take-text.sm{font-size:24px}
.dialwrap{text-align:center;padding:10px 0}
.dialover{position:fixed;inset:0;z-index:40;background:var(--ground);display:flex;flex-direction:column;max-width:540px;margin:0 auto;padding:12px 16px max(12px,env(safe-area-inset-bottom))}
.dialover .q{font-family:var(--display);font-size:22px;line-height:1.05;text-wrap:balance;margin:0 0 4px}
.dialover .dialnum{font-size:clamp(72px,18vh,120px);flex:0 0 auto}
.dialover .drum{flex:1 1 auto;min-height:160px;height:auto}
.dialover .chips{margin:8px 0 6px}
.dialover .chips{flex-wrap:nowrap;gap:6px}
.dialover .chips button{padding:8px 0;font-size:15px;min-width:0;flex:1}
.dialover .btn.big{font-size:20px;padding:14px}
.dialover .foot{display:flex;gap:8px;margin-top:8px}
.dialnum{font-family:var(--display);font-size:120px;line-height:.9;letter-spacing:.01em;color:var(--ember2);font-variant-numeric:tabular-nums}
.dialnum sup{font-size:48px;vertical-align:top;color:var(--ember);margin-left:2px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin:10px 0}
input[type=range]::-webkit-slider-runnable-track{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--no),var(--gold) 50%,var(--yes))}
input[type=range]::-moz-range-track{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--no),var(--gold) 50%,var(--yes))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:44px;height:44px;border-radius:50%;background:var(--bone);border:5px solid var(--ember);margin-top:-15px;box-shadow:0 4px 18px rgba(0,0,0,.5)}
input[type=range]::-moz-range-thumb{width:34px;height:34px;border-radius:50%;background:var(--bone);border:5px solid var(--ember)}
.drum{position:relative;height:300px;overflow:hidden;border-radius:16px;background:linear-gradient(180deg,#0d0a07 0%,var(--panel2) 22%,var(--panel2) 78%,#0d0a07 100%);border:1px solid var(--line);touch-action:none;user-select:none;cursor:grab;box-shadow:inset 0 18px 30px rgba(0,0,0,.6),inset 0 -18px 30px rgba(0,0,0,.6)}
.drum.grab{cursor:grabbing}
.drum .seg{position:absolute;left:0;right:0;top:50%;height:54px;margin-top:-27px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:46px;letter-spacing:.02em;color:var(--bone);border-top:1px solid rgba(255,255,255,.06);border-bottom:1px solid rgba(0,0,0,.5);will-change:transform,opacity;font-variant-numeric:tabular-nums}
.drum .seg{background:rgba(230,182,79,.08)}
.drum .seg.alt{background:rgba(240,116,42,.14)}
.drum .seg.k5{color:var(--gold)}
.drum .seg.k10{color:var(--ember2);font-size:52px}
.drum .win{position:absolute;left:0;right:0;top:50%;height:58px;margin-top:-29px;border-top:2px solid var(--ember);border-bottom:2px solid var(--ember);pointer-events:none;box-shadow:0 0 24px rgba(240,116,42,.35)}
.drum .ptr{position:absolute;right:0;top:50%;width:0;height:0;margin-top:-14px;border-top:14px solid transparent;border-bottom:14px solid transparent;border-right:20px solid var(--gold);pointer-events:none;filter:drop-shadow(0 0 6px rgba(230,182,79,.6))}
.drum .ptr.l{right:auto;left:0;border-right:0;border-left:20px solid var(--gold)}
.drum .hint{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-family:var(--cond);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);pointer-events:none}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0 14px}
.chips button{background:var(--panel2);border:1px solid var(--line);color:var(--bone);font-family:var(--cond);font-weight:600;font-size:15px;padding:8px 14px;border-radius:999px;cursor:pointer;min-width:52px}
.numctl{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin:8px 0 14px}
.numctl button{background:var(--panel2);border:1px solid var(--line);color:var(--bone);font-family:var(--cond);font-weight:600;font-size:18px;padding:14px 0;border-radius:8px;cursor:pointer}
.cover{position:fixed;inset:0;z-index:20;background:var(--ground);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.cover .big{font-family:var(--display);font-size:56px;line-height:1;margin:8px 0 4px}
.cover .big em{font-style:normal;color:var(--ember)}
.bars{display:flex;flex-direction:column;gap:10px;margin:14px 0}
.bar{display:grid;grid-template-columns:78px 1fr 64px;align-items:center;gap:10px;font-family:var(--cond);font-weight:600;font-size:18px}
.bar .tr{height:22px;background:var(--ground);border-radius:6px;overflow:hidden;position:relative;border:1px solid var(--line)}
.bar .fl{height:100%;background:var(--ember);border-radius:5px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar.out .fl{background:var(--gold)}
.bar .v{text-align:right;font-family:var(--display);font-size:30px;color:var(--bone);font-variant-numeric:tabular-nums}
.bar.out .v{color:var(--gold)}
.bar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stat{background:var(--ground);border:1px solid var(--line);border-radius:10px;padding:10px 8px;text-align:center}
.stat .k{font-family:var(--cond);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.stat .v{font-family:var(--display);font-size:30px;line-height:1.05;color:var(--bone);font-variant-numeric:tabular-nums}
.stat .v.gold{color:var(--gold)}
.author{font-family:var(--cond);font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:13px;color:var(--ember2)}
table{width:100%;border-collapse:collapse;font-size:15px}
th{font-family:var(--cond);font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
td{padding:9px 6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;vertical-align:top}
td.n,th.n{text-align:right}
.tblwrap{overflow-x:auto}
.year{display:flex;align-items:baseline;gap:12px;margin:26px 0 8px}
.year .y{font-family:var(--display);font-size:44px;line-height:1;color:var(--ember)}
.year .s{font-family:var(--cond);color:var(--mute);letter-spacing:.06em;text-transform:uppercase;font-size:13px}
.arc{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden}
.arc-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
.arc-head .kind{font-family:var(--cond);font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.sec{padding:10px 12px}
.sec+.sec{border-top:1px dashed var(--line)}
.sec .lbl{font-family:var(--cond);font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.sec.take{background:var(--panel2);background-image:repeating-linear-gradient(180deg,rgba(255,255,255,.02) 0 2px,transparent 2px 7px)}
.sec.take .lbl{color:var(--ember2)}
.sec.result{background:rgba(230,182,79,.06);font-size:13px}
.sec.result .lbl{color:var(--gold)}
.arc .q{font-family:var(--display);font-size:23px;letter-spacing:.02em;line-height:1.05;margin:0}
.big-actual{font-family:var(--display);font-size:36px;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.g .tag{font-family:var(--cond);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-top:3px}
.g .tag.off{color:var(--dim)}
.g .tag.half{color:var(--mute)}
.g.x{opacity:.7}
.gl{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0}
.g{background:var(--ground);border:1px solid var(--line);border-radius:8px;padding:6px 4px;text-align:center}
.g .n{font-family:var(--cond);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.g .v{font-family:var(--display);font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums}
.g.w{border-color:var(--gold);background:rgba(230,182,79,.08)}
.g.w .v{color:var(--gold)}
.g.h{border-color:rgba(230,182,79,.4)}
.g .v.txt{font-family:var(--cond);font-weight:600;font-size:13px;line-height:1.15}
.res{font-size:13px;margin-top:4px}
.res b{color:var(--gold);font-family:var(--cond);font-size:13px;letter-spacing:.1em;text-transform:uppercase;margin-right:6px}
.note{color:var(--mute);font-size:13px;font-style:italic}
.lb{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.lb .rk{font-family:var(--display);font-size:28px;color:var(--dim)}
.lb:first-child .rk{color:var(--gold)}
.lb .nm{font-family:var(--cond);font-weight:600;font-size:20px;letter-spacing:.03em}
.lb .sub{font-size:12px;color:var(--mute)}
.lb .pts{font-family:var(--display);font-size:34px;color:var(--bone);font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--gold);color:#1a1205;font-family:var(--cond);font-weight:600;letter-spacing:.06em;padding:10px 16px;border-radius:999px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.mode{font-family:var(--cond);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);text-align:center;padding:0;flex:0 0 auto;line-height:1.2}
.mode b{color:var(--mute)}
.code{font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all;background:var(--ground);border:1px solid var(--line);border-radius:8px;padding:10px;color:var(--mute);max-height:120px;overflow:auto}
details{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:10px 0}
summary{font-family:var(--cond);font-weight:600;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;color:var(--mute)}
ol.steps{padding-left:20px;font-size:14px}
ol.steps li{margin:6px 0}
.mytake{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.mytake .t{font-family:var(--cond);font-weight:600;font-size:18px;line-height:1.2}
.x{background:none;border:0;color:var(--dim);font-size:20px;cursor:pointer;padding:0 4px}
.src{font-size:12px;color:var(--dim);margin-top:24px}
/* sky */
.sky{position:fixed;inset:-40% -40% 0 -40%;z-index:0;pointer-events:none;transform-origin:22% 12%;animation:skyspin 1400s linear infinite;background:radial-gradient(1px 1px at 12% 8%,rgba(243,233,216,.7),transparent 2px),radial-gradient(1px 1px at 28% 4%,rgba(243,233,216,.5),transparent 2px),radial-gradient(1.5px 1.5px at 47% 11%,rgba(243,233,216,.8),transparent 2px),radial-gradient(1px 1px at 63% 6%,rgba(243,233,216,.5),transparent 2px),radial-gradient(1px 1px at 78% 13%,rgba(243,233,216,.6),transparent 2px),radial-gradient(1.5px 1.5px at 90% 5%,rgba(243,233,216,.7),transparent 2px),radial-gradient(1px 1px at 84% 20%,rgba(243,233,216,.4),transparent 2px),radial-gradient(1px 1px at 5% 22%,rgba(243,233,216,.4),transparent 2px),radial-gradient(1px 1px at 35% 18%,rgba(243,233,216,.5),transparent 2px),radial-gradient(1px 1px at 55% 24%,rgba(243,233,216,.35),transparent 2px),radial-gradient(1px 1px at 70% 30%,rgba(243,233,216,.3),transparent 2px),radial-gradient(1.5px 1.5px at 22% 30%,rgba(243,233,216,.45),transparent 2px)}
@keyframes skyspin{to{transform:rotate(360deg)}}
.aurora{position:fixed;left:-10%;right:-10%;top:0;height:38%;z-index:0;pointer-events:none;opacity:0;filter:blur(18px);background:linear-gradient(180deg,rgba(80,220,160,0) 0%,rgba(80,220,160,.35) 35%,rgba(60,170,200,.25) 60%,rgba(80,220,160,0) 100%);transform:skewY(-6deg);animation:aurora 140s ease-in-out infinite 25s}
@keyframes aurora{0%,62%{opacity:0}70%{opacity:.5}78%{opacity:.25}86%{opacity:.55}94%,100%{opacity:0}}
#hearth{position:fixed;inset:0;z-index:0;pointer-events:none}
/* reveal */
.rev{position:fixed;inset:0;z-index:45;background:rgba(10,7,5,.97);display:flex;flex-direction:column;justify-content:center;padding:20px 18px max(20px,env(safe-area-inset-bottom));max-width:540px;margin:0 auto}
.rev .eyebrow{font-family:var(--cond);font-weight:600;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--ember2);text-align:center;margin-bottom:8px}
.rev .q{font-family:var(--display);font-size:30px;line-height:1.02;text-align:center;text-wrap:balance;margin:0 0 18px}
.rev .bars{gap:12px}
.rev .bar{opacity:0;transform:translateY(10px);transition:opacity .35s,transform .35s}
.rev .bar.in{opacity:1;transform:none}
.rev .bar .fl{transition:width .9s cubic-bezier(.2,.8,.2,1)}
.rev .verdict{text-align:center;font-family:var(--display);font-size:26px;letter-spacing:.04em;margin-top:18px;opacity:0;transition:opacity .5s}
.rev .verdict.in{opacity:1}
.rev .verdict b{color:var(--gold);text-shadow:0 0 18px rgba(230,182,79,.8)}
.rev .tap{text-align:center;font-family:var(--cond);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin-top:22px;opacity:0;transition:opacity .5s}
.rev .tap.in{opacity:1}
/* player colours */
.bar .nm i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.bar.out .tr{box-shadow:0 0 0 1px var(--gold),0 0 14px rgba(230,182,79,.35)}
/* audit night */
.aud{position:fixed;inset:0;z-index:45;background:transparent;display:flex;flex-direction:column;max-width:540px;margin:0 auto;padding:10px 14px max(10px,env(safe-area-inset-bottom))}
.aud .top{display:flex;justify-content:space-between;align-items:center}
.aud .ttl{font-family:var(--display);font-size:24px;letter-spacing:.04em;color:var(--ember2)}
.aud .cnt{font-family:var(--cond);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.aud .body{flex:1;min-height:0;overflow-y:auto;margin:8px 0}
.flap{position:relative;margin-top:10px;border-radius:12px;overflow:hidden;background:var(--panel);border:1px solid var(--line)}
.flap .inner{padding:14px 16px}
.flap .cover{position:absolute;inset:0;background:linear-gradient(180deg,#2a1d12,#1b120b);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;font-family:var(--cond);font-weight:600;letter-spacing:.16em;text-transform:uppercase;font-size:12px;color:var(--mute);transition:transform .7s cubic-bezier(.6,0,.3,1),opacity .7s;transform-origin:50% 0}
.flap .cover::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:14px;background:radial-gradient(6px 6px at 10px 50%,#0d0a07 60%,transparent 62%) 0 0/22px 12px repeat-x;transform:scaleY(-1)}
.flap.open .cover{transform:rotateX(-100deg) translateY(-20px);opacity:0}
.flap .res{font-family:var(--display);font-size:64px;line-height:1;color:var(--gold);text-align:center;font-variant-numeric:tabular-nums}
.flap .res.hit{color:var(--yes)}.flap .res.miss{color:var(--no)}
.audban{background:linear-gradient(90deg,rgba(240,116,42,.25),rgba(230,182,79,.15));border:1px solid var(--ember);border-radius:10px;padding:10px 12px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--cond);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:13px}
/* audit stage */
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.chip{border:1px solid var(--line);border-radius:8px;padding:5px 2px;text-align:center;background:var(--panel);position:relative}
.chip .nm{font-family:var(--display);font-size:15px;letter-spacing:.04em;line-height:1}
.chip .rec{font-family:var(--cond);font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums;margin-top:2px}
.chip .rec b{color:var(--bone)}
.chip.bump{animation:bump .45s cubic-bezier(.2,.9,.3,1.3)}
.chip .cst{display:none}
.chip .cst.on{animation:stamp .45s cubic-bezier(.2,.9,.3,1.3) forwards}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}
.takebox{position:relative;margin:14px 0 10px;min-height:64px}
.takebox .au{font-family:var(--cond);font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ember2);opacity:0;transition:opacity .8s}
.takebox .q{font-family:var(--display);font-size:28px;line-height:1.02;text-wrap:balance;margin:2px 0 0;opacity:0;filter:blur(8px);transform:translateY(8px);transition:opacity 1s,filter 1s,transform 1s}
.takebox.shown .q,.takebox.shown .au{opacity:1;filter:none;transform:none}
.torches{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.torch{--c:var(--ember);text-align:center;position:relative;padding:10px 4px 8px;border-radius:10px;background:var(--panel);border:1px solid var(--line);transition:border-color .5s,background .5s}
.torch.win{border-color:var(--gold);background:rgba(230,182,79,.08)}
.torch.out{background:#100c09;filter:saturate(.15) brightness(.62);transition:filter 1.6s ease,background 1.2s}
.flame{width:28px;height:46px;margin:0 auto 6px;position:relative;opacity:0;transform:scale(.3);transition:opacity .45s,transform .55s cubic-bezier(.2,.9,.3,1.4),filter .6s;transform-origin:50% 100%}
.flame::before{content:"";position:absolute;inset:0;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;background:radial-gradient(ellipse at 50% 85%,#fff3c4 0,var(--c) 38%,rgba(0,0,0,0) 72%);filter:blur(.6px);animation:flick .38s ease-in-out infinite alternate;transform-origin:50% 100%}
.flame::after{content:"";position:absolute;left:30%;right:30%;top:45%;bottom:6%;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;background:radial-gradient(ellipse at 50% 80%,#fff 0,#ffe08a 45%,rgba(0,0,0,0) 75%);animation:flick .29s ease-in-out infinite alternate-reverse;transform-origin:50% 100%}
@keyframes flick{from{transform:scaleX(.92) scaleY(.96) skewX(-4deg)}to{transform:scaleX(1.06) scaleY(1.05) skewX(4deg)}}
.torch.lit .flame{opacity:1;transform:scale(1)}
.torch.out .flame{opacity:.12;transform:scale(.35);filter:grayscale(1)}
.torch.win .flame{transform:scale(1.45);filter:drop-shadow(0 0 10px var(--c))}
.torch .nm{font-family:var(--cond);font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.torch .g{font-family:var(--display);font-size:24px;line-height:1.05;color:var(--bone);opacity:0;transition:opacity .4s;font-variant-numeric:tabular-nums;word-break:break-word}
.torch .g.txt{font-family:var(--cond);font-weight:600;font-size:13px;line-height:1.15}
.torch.lit .g{opacity:1}
.torch.out .g,.torch.out .nm{color:var(--dim)}
.torch.out .g{text-decoration:line-through;text-decoration-color:rgba(255,255,255,.25)}
.torch .sub{font-family:var(--cond);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-top:3px;opacity:0;transition:opacity .4s}
.torch.out .sub,.torch.win .sub{opacity:1}
.torch.win .sub{color:var(--gold)}
.torch .st{display:none}
.torch .st.on{animation:stamp .45s cubic-bezier(.2,.9,.3,1.3) forwards}
.st.w,.cst.w{color:var(--gold);text-shadow:0 0 10px rgba(230,182,79,.7)}
.st.l,.cst.l{color:var(--no)}
@keyframes stamp{0%{opacity:0;transform:scale(3) rotate(-15deg)}60%{opacity:1;transform:scale(.88) rotate(-8deg)}100%{opacity:1;transform:scale(1) rotate(-10deg)}}
.resbox{margin-top:12px;opacity:0;transform:translateY(10px);transition:opacity .6s,transform .6s}
.resbox.in{opacity:1;transform:none}
.resbox .big{font-family:var(--display);font-size:46px;line-height:1;text-align:center;color:var(--gold);font-variant-numeric:tabular-nums}
.resbox .big.hit{color:var(--yes)}.resbox .big.miss{color:var(--no)}
.resbox .sec{border-radius:10px;border:1px solid var(--line);margin-top:8px}
.mctl{margin-top:12px}
#glfire{position:fixed;inset:0;z-index:44;pointer-events:none;display:none}
#ov{position:fixed;inset:0;z-index:45;pointer-events:none}
#ov:empty{display:none}
#ov>*{pointer-events:auto}
.cine{position:fixed;inset:0;z-index:46;pointer-events:none;display:none;background:radial-gradient(120% 90% at 50% 45%,rgba(0,0,0,0) 45%,rgba(0,0,0,.55) 100%);transition:background .9s}
.cine.dark{background:radial-gradient(90% 70% at 50% 42%,rgba(0,0,0,0) 30%,rgba(0,0,0,.8) 100%)}
.cine::after{content:"";position:absolute;inset:-20%;opacity:.07;mix-blend-mode:overlay;background-image:var(--grain);background-size:256px 256px;animation:grain .5s steps(4) infinite}
@keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-40px,30px)}50%{transform:translate(30px,-50px)}75%{transform:translate(-20px,-20px)}100%{transform:translate(50px,10px)}}
.aud .body{transition:transform 1.4s cubic-bezier(.2,.7,.2,1);transform-origin:50% 40%}
.aud .body.zoom{transform:scale(1.04)}
.gl .torch{background:none!important;border:0!important;box-shadow:none!important;overflow:visible}
.gl .torch::before{content:"";position:absolute;left:0;right:0;top:64px;bottom:0;border-radius:10px;background:rgba(28,21,15,.82);border:1px solid rgba(61,48,37,.7);z-index:0}
.gl .torch>*{position:relative;z-index:1}
.gl .torch.win::before{border-color:var(--gold);background:rgba(230,182,79,.10);box-shadow:0 0 22px rgba(230,182,79,.25)}
.gl .torch.out::before{background:rgba(14,11,9,.85);border-color:rgba(61,48,37,.4)}
.gl .torch .flame{height:52px}
.gl .flame{opacity:0!important}
.gl .flame::before,.gl .flame::after{display:none}
/* golf scorecard */
.gc{width:100%;border-collapse:separate;border-spacing:0;font-family:var(--cond);font-variant-numeric:tabular-nums}
.gc th{font-size:11px;letter-spacing:.14em;color:var(--mute);padding:6px 4px;border-bottom:2px solid var(--line);text-align:center}
.gc th:first-child,.gc td:first-child{text-align:left}
.gc td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:center;font-size:15px}
.gc td .wl{display:block;font-size:11px;color:var(--mute);letter-spacing:.06em}
.gc td .n{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;border:2px solid transparent;font-family:var(--display);font-size:20px}
.gc td.best .n{border-color:var(--gold);color:var(--gold);box-shadow:0 0 12px rgba(230,182,79,.35)}
.gc td.tot{font-family:var(--display);font-size:24px;color:var(--bone)}
.gc td .nm{font-family:var(--display);font-size:18px;letter-spacing:.03em}
/* the C and A: a jersey patch, white tackle twill with a black border */
.ltr{display:inline-block;width:22px;height:22px;vertical-align:-5px;overflow:visible;filter:drop-shadow(0 1px 1px rgba(0,0,0,.6))}
.ltr.a{width:22px;height:22px}
.who-row{display:inline-flex;align-items:center;gap:8px}
.who-row .nm{line-height:1}
.who-row .ltr,.who-row .fraud{margin:0;vertical-align:0}
.fraud{display:inline-block;margin-left:6px;vertical-align:2px;font-family:var(--display);font-size:12px;letter-spacing:.14em;line-height:1;padding:3px 6px 2px;border:2px solid var(--no);color:var(--no);border-radius:3px;transform:rotate(-6deg);text-transform:uppercase}
.pick-grid .sub{display:flex;gap:8px;justify-content:center;margin-top:8px;font-size:0}
.pick-grid .sub .ltr{width:26px;height:26px;margin:0}
.pick-grid .sub .fraud{font-size:14px;margin:0}
.badge{display:inline-block;font-family:var(--cond);font-weight:600;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#1a1205;background:var(--gold);border-radius:4px;padding:2px 6px;margin-left:6px;vertical-align:2px}
.badge.dim{background:var(--panel2);color:var(--mute);border:1px solid var(--line)}
.snd{background:none;border:1px solid var(--line);color:var(--mute);border-radius:999px;padding:4px 9px;font-size:13px;cursor:pointer}
main.stackmode{display:flex;flex-direction:column;padding-bottom:10px}
.stackhead{display:flex;justify-content:space-between;align-items:baseline;margin:4px 0 6px}
.stackhead .y{font-family:var(--display);font-size:30px;line-height:1;color:var(--ember)}
.stackhead .s{font-family:var(--cond);color:var(--mute);letter-spacing:.06em;text-transform:uppercase;font-size:10px;text-align:right}
.stackhead .s b{display:inline;color:var(--bone);font-size:12px;margin-left:8px}
.stackwrap{position:relative;flex:1 1 auto;min-height:0;margin-bottom:22px}
.sc{position:absolute;inset:0;touch-action:pan-y;user-select:none;-webkit-user-select:none;will-change:transform;transform-origin:50% 100%}
.sc .arc{margin:0;height:100%;overflow-y:auto;touch-action:pan-y;box-shadow:0 18px 50px rgba(0,0,0,.55);background:var(--panel)}
.sc.dragging .arc{overflow:hidden}
.sc.top{cursor:grab;z-index:3}
.sc.b1{z-index:2;transform:translateY(12px) scale(.96);filter:brightness(.75);pointer-events:none}
.sc.b2{z-index:1;transform:translateY(24px) scale(.92);filter:brightness(.5);pointer-events:none}
.sc.spring{transition:transform .35s cubic-bezier(.2,.9,.2,1.2)}
.sc.fly{transition:transform .45s cubic-bezier(.3,.6,.6,1),opacity .45s}
.sc .stamp{position:absolute;top:14px;font-family:var(--display);font-size:28px;letter-spacing:.08em;padding:2px 12px;border:3px solid;border-radius:8px;opacity:0;pointer-events:none;z-index:5}
.sc .stamp.l{right:14px;color:var(--ember2);border-color:var(--ember2);transform:rotate(12deg)}
.sc .stamp.r{left:14px;color:var(--gold);border-color:var(--gold);transform:rotate(-12deg)}
.stackctl{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:4px;flex:0 0 auto}
.stackctl .btn{padding:8px 14px;font-size:14px}
.stackctl .hintt{font-family:var(--cond);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
#sparks{position:fixed;inset:0;z-index:60;pointer-events:none}
.endcard{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
.endcard .big{font-family:var(--display);font-size:44px;line-height:1}
.src a{color:var(--mute)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}#hearth{display:none}}

/* ---- The Firepit Hour booth (Hayes & O'Dog) ---- */
.booth{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#0b0a12;margin:10px 0 0;box-shadow:0 14px 34px -20px #000}
.booth svg{display:block;width:100%;height:auto}
.booth .spot{transition:opacity .35s}
.booth .nm{font-family:var(--display);font-size:26px;letter-spacing:.06em;fill:#f3e9d8}
.booth .plac{font-family:var(--cond);font-weight:600;font-size:12px;letter-spacing:.2em;text-transform:uppercase;fill:#f3e9d8}
.booth .vu{position:absolute;bottom:4.5%;width:17%;margin:0;display:flex;flex-direction:column;gap:3px;pointer-events:none}
.booth .vu.l{left:2.5%}.booth .vu.r{right:2.5%}
.booth .vu canvas{width:100%;aspect-ratio:2.1;display:block;border-radius:4px;box-shadow:0 2px 6px rgba(0,0,0,.6)}
.booth .vu figcaption{display:flex;align-items:center;justify-content:center;gap:5px;font-family:var(--cond);font-weight:600;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.booth .vu figcaption i{width:6px;height:6px;border-radius:50%;background:#3a2c22;transition:background .15s,box-shadow .15s}
.booth .vu.talk figcaption i{background:var(--c);box-shadow:0 0 8px var(--c)}
.booth .vu.talk figcaption{color:var(--c)}
.bcap{display:flex;align-items:flex-start;gap:8px;min-height:40px;margin:8px 0 0;padding-inline:2px}
.bcap .tag{flex:none;margin-top:2px;font-family:var(--cond);font-weight:600;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--c,var(--gold));border:1px solid currentColor;border-radius:3px;padding:1px 6px 0}
.bcap p{margin:0;flex:1;font-weight:500;font-size:15px;line-height:1.3;color:var(--bone);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.bcap .snd{flex:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--bone);font-size:16px;line-height:1;padding:5px 8px;cursor:pointer}
.bcap .snd[hidden]{display:none}
.torch.hot{border-color:var(--c)}
.gl .g.hot{border-radius:8px}
.arc .callbtn{display:block;width:100%;margin-top:10px}
.bov{position:fixed;inset:0;z-index:47;background:var(--ground);display:flex;flex-direction:column;max-width:540px;margin:0 auto;padding:10px 14px max(10px,env(safe-area-inset-bottom))}
.bov .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bov .ttl{font-family:var(--display);font-size:24px;letter-spacing:.04em;color:var(--ember2)}
.bov .cnt{font-family:var(--cond);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-left:auto}
.bov .body{flex:1;min-height:0;overflow-y:auto;margin:6px 0 10px}
.bov .bcard{margin-top:10px}
.bov .bcard .arc{margin:0;height:auto;box-shadow:none}

/* ---- Firepit Hour edition of the audit card ---- */
.booth-aud .takebox{margin:8px 0 4px;min-height:0}
.booth-aud .takebox .q{font-size:24px}
.booth-aud .booth{margin-top:6px}
.picks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:8px}
.pk{--c:var(--ember);position:relative;border:1px solid var(--line);border-radius:8px;padding:8px 4px 6px;text-align:center;background:var(--panel2);transition:border-color .25s,box-shadow .25s,opacity .4s}
.pk::before{content:"";position:absolute;left:8px;right:8px;top:0;height:3px;border-radius:0 0 3px 3px;background:var(--c)}
.pk .nm{font-family:var(--cond);font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-top:2px}
.pk .g{font-family:var(--display);font-size:26px;line-height:1;color:var(--bone);margin-top:3px;font-variant-numeric:tabular-nums;word-break:break-word}
.pk .g.txt{font-family:var(--cond);font-weight:600;font-size:12px;line-height:1.15}
.pk .wl{height:14px;font-family:var(--display);font-size:14px;letter-spacing:.1em;line-height:14px;margin-top:3px;color:transparent}
.pk.hot{border-color:var(--c)}
.pk.hot .nm{color:var(--c)}
.pk.win{border-color:var(--gold);background:rgba(230,182,79,.08)}
.pk.win .wl{color:var(--yes)}
.pk.out .wl{color:var(--no)}
.pk.out .g{text-decoration:line-through;color:var(--dim)}
.pk.out{opacity:.75}
.bres{display:flex;align-items:baseline;gap:12px;margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)}
.bres .lbl{font-family:var(--cond);font-weight:600;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
.bres .num{font-family:var(--display);font-size:40px;line-height:1;color:var(--dim);font-variant-numeric:tabular-nums;transition:color .3s}
.bres .num.txt{font-size:22px;letter-spacing:.04em}
.bres.on .num{color:var(--ember2);text-shadow:0 0 18px rgba(240,116,42,.5)}
.bres.on .num.hit{color:var(--yes);text-shadow:none}

/* Supabase backend: one row per room in table `firepit` (room text pk, state jsonb). Per-path writes go through the
   firepit_set() SQL function (atomic, like Firebase child().set()); every phone listens to the row via Realtime.
   Setup SQL is in the Marshal tab. */
const SUPABASE_SQL=`create table if not exists public.firepit (room text primary key, state jsonb not null default '{}'::jsonb, updated_at timestamptz not null default now());
alter table public.firepit enable row level security;
drop policy if exists "firepit open" on public.firepit;
create policy "firepit open" on public.firepit for all to anon, authenticated using (true) with check (true);
alter table public.firepit replica identity full;
do $$ begin
  if not exists (select 1 from pg_publication_tables where pubname='supabase_realtime' and schemaname='public' and tablename='firepit')
  then alter publication supabase_realtime add table public.firepit; end if;
end $$;
create or replace function public.firepit_set(p_room text, p_path text[], p_val jsonb)
returns void language plpgsql security definer as $$
declare s jsonb; i int;
begin
  insert into public.firepit(room, state) values (p_room, '{}'::jsonb) on conflict (room) do nothing;
  select state into s from public.firepit where room = p_room for update;
  for i in 1 .. coalesce(array_length(p_path, 1), 0) - 1 loop
    if s #> p_path[1:i] is null or jsonb_typeof(s #> p_path[1:i]) <> 'object' then s := jsonb_set(s, p_path[1:i], '{}'::jsonb, true); end if;
  end loop;
  if p_val is null then s := s #- p_path; else s := jsonb_set(s, p_path, p_val, true); end if;
  update public.firepit set state = s, updated_at = now() where room = p_room;
end $$;
create or replace function public.firepit_replace(p_room text, p_state jsonb)
returns void language sql security definer as $$
  insert into public.firepit(room, state, updated_at) values (p_room, p_state, now())
  on conflict (room) do update set state = excluded.state, updated_at = now();
$$;
grant execute on function public.firepit_set(text, text[], jsonb) to anon, authenticated;
grant execute on function public.firepit_replace(text, jsonb) to anon, authenticated;`;
function makeSupabaseSync(){
  let sb=null, chan=null;
  function apply(path,val){ const seg=path.split("/"); let o=state; for(let i=0;i<seg.length-1;i++){ if(!o[seg[i]]||typeof o[seg[i]]!=="object") o[seg[i]]={}; o=o[seg[i]]; } if(val===null) delete o[seg[seg.length-1]]; else o[seg[seg.length-1]]=val; }
  async function pull(){ const {data,error}=await sb.from("firepit").select("state").eq("room",ROOM).maybeSingle(); if(error) throw error; if(!data){ await sb.rpc("firepit_replace",{p_room:ROOM,p_state:defaultState()}); return defaultState(); } return data.state; }
  return {
    start(){
      const add=(src)=>new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)});
      add("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js").then(()=>{
        sb=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseKey);
        return pull();
      }).then(st=>{ state=mergeDefaults(st); connected=true; render();
        chan=sb.channel("firepit-"+ROOM).on("postgres_changes",{event:"*",schema:"public",table:"firepit",filter:"room=eq."+ROOM},p=>{ if(p.new&&p.new.state){ state=mergeDefaults(p.new.state); render(); } }).subscribe(st=>{ if(st==="CHANNEL_ERROR"||st==="TIMED_OUT") toast("Live updates dropped. Pull down to refresh."); });
        setInterval(()=>{ if(document.hidden||!sb) return; pull().then(st=>{ const j=JSON.stringify(mergeDefaults(st)); if(j!==JSON.stringify(state)){ state=JSON.parse(j); render(); } }).catch(()=>{}); },20000); // belt and braces if Realtime misses one
      }).catch(e=>{ toast("Couldn't reach Supabase: "+(e&&e.message||e)+". Running on this phone only."); mode="local"; sync=makeLocalSync(); sync.start(); });
    },
    set(path,val){ if(!sb){toast("Still connecting…");return;} apply(path,val); render(); sb.rpc("firepit_set",{p_room:ROOM,p_path:path.split("/"),p_val:val}).then(({error})=>{ if(error) toast("Sync failed: "+error.message); }); },
    replace(st){ if(!sb){toast("Still connecting…");return;} state=mergeDefaults(st); render(); sb.rpc("firepit_replace",{p_room:ROOM,p_state:state}).then(({error})=>{ if(error) toast("Sync failed: "+error.message); }); }
  };
}

const SND={ctx:null,

};

void main(){vec2 p=v*res;vec3 c=vec3(0.);
for(int i=0;i<4;i++){vec4 f=fl[i];if(f.w<=0.002)continue;vec2 uv=(p-f.xy)/f.z;
 float t=time*1.7+float(i)*7.3;vec2 q=vec2(uv.x*2.2,uv.y*1.4-t);
 float n=fbm(q*2.0);float n2=fbm(q*4.3+3.1);
 float sway=(n-.5)*.35*uv.y+sin(time*3.1+float(i))*.04*uv.y;
 float w=(.5-.40*uv.y)*(.85+.3*f.w);
 float body=1.-smoothstep(0.,max(w,.02),abs(uv.x+sway));
 float vert=smoothstep(-.06,.12,uv.y)*(1.-smoothstep(.45,1.15+.35*f.w,uv.y+(n2-.5)*.55));

  const nums=vals.map(x=>x.v); const med=nums.length?median(nums):0;

  let outId=null, outD=-1; if(vals.length>=3) vals.forEach(x=>{const d=Math.abs(x.v-med); if(d>outD){outD=d;outId=x.id;}});

/* ---- THE BIG WHEEL ---- */
let DRUM=null;
function initDrum(){
  const el=document.getElementById("drum"); if(!el||el._init) return; el._init=true;
  const MAX=100; const H=el.clientHeight||300; const VIS=H<230?7:9; const SEG=54;
  let pos=ui.dial.val, vel=0, dragging=false, lastY=0, lastT=0, raf=null, lastTick=Math.round(pos), win=null;
  const segs=[];
  for(let i=0;i<VIS+2;i++){ const d=document.createElement("div"); d.className="seg"; el.insertBefore(d, el.firstChild); segs.push(d); }
  const hint=el.querySelector(".hint");
  function tick(){ try{ if(navigator.vibrate) navigator.vibrate(6); }catch(e){} SND.tick(Math.abs(vel)); }
  function draw(){
    const c=Math.round(pos); const half=Math.floor(segs.length/2);
    segs.forEach((d,k)=>{ const n=c-half+k; const off=n-pos; const ang=off/(VIS/2)*Math.PI/2; const y=Math.sin(ang)*(VIS/2)*SEG*0.62; const sc=Math.max(.35,Math.cos(ang)); if(Math.abs(ang)>=Math.PI/2){ d.style.opacity=0; return; } const lab=((n%(MAX+1))+(MAX+1))%(MAX+1); d.textContent=lab; d.className="seg"+(lab%2?" alt":"")+(lab%10===0?" k10":lab%5===0?" k5":""); d.style.opacity=(.25+.75*sc).toFixed(2); d.style.transform=`translateY(${y.toFixed(1)}px) scaleY(${sc.toFixed(3)})`; d.style.zIndex=Math.round(sc*100); });
    const shown=((c%(MAX+1))+(MAX+1))%(MAX+1); const dn=document.getElementById("dn"); if(dn) dn.innerHTML=shown+"<sup>%</sup>";
    if(c!==lastTick){ lastTick=c; tick(); }
  }
  function step(t){
    if(!dragging){
      pos+=vel; vel*=0.965;
      
      if(Math.abs(vel)<0.02){ const target=Math.round(pos); pos+=(target-pos)*0.25; if(Math.abs(target-pos)<0.005){ pos=((target%(MAX+1))+(MAX+1))%(MAX+1); vel=0; draw(); ui.dial.val=pos; raf=null; SND.clack(); return; } }
    }
    draw(); raf=requestAnimationFrame(step);
  }
  function start(){ if(!raf) raf=requestAnimationFrame(step); }
  el.addEventListener("pointerdown",e=>{ dragging=true; vel=0; lastY=e.clientY; lastT=performance.now(); el.setPointerCapture(e.pointerId); el.classList.add("grab"); if(hint) hint.style.opacity=0; e.preventDefault(); });
  el.addEventListener("pointermove",e=>{ if(!dragging) return; const now=performance.now(); const dy=e.clientY-lastY; const dt=Math.max(1,now-lastT); const dpos=-dy/SEG*1.15; pos+=dpos; vel=vel*0.5+(dpos/dt*16)*0.5; lastY=e.clientY; lastT=now; draw(); });
  const end=e=>{ if(!dragging) return; dragging=false; el.classList.remove("grab"); if(performance.now()-lastT>80) vel=0; vel=Math.max(-3.5,Math.min(3.5,vel)); start(); };
  el.addEventListener("pointerup",end); el.addEventListener("pointercancel",end);
  el.addEventListener("wheel",e=>{ e.preventDefault(); vel-=e.deltaY/400; start(); },{passive:false});
  DRUM={ animateTo(n){ vel=0; dragging=false; const cur=((pos%(MAX+1))+(MAX+1))%(MAX+1); pos=cur; let diff=n-cur; if(diff>(MAX+1)/2) diff-=(MAX+1); if(diff<-(MAX+1)/2) diff+=(MAX+1); const from=pos; n=from+diff; const t0=performance.now(); const go=(t)=>{ const k=Math.min(1,(t-t0)/420); const ease=1-Math.pow(1-k,3); pos=from+(n-from)*ease; draw(); if(k<1) requestAnimationFrame(go); else { pos=((n%(MAX+1))+(MAX+1))%(MAX+1); ui.dial.val=pos; draw(); } }; if(raf){ cancelAnimationFrame(raf); raf=null; } requestAnimationFrame(go); } };
  draw();
}
function lockVote(){ const d=ui.dial; if(!d) return; SND.thud(); try{ if(navigator.vibrate) navigator.vibrate([20,30,40]); }catch(e){} sync.set(`votes/${d.take}/${me()}`,{v:d.val,t:Date.now()}); ui.dial=null; DRUM=null; toast("Locked in"); render(); }

/* ---- THE REVEAL: 4th number lands ---- */
function completeIds(){ return takesList().filter(t=>!state.results[t.id]&&PLAYERS.every(p=>(state.votes[t.id]||{})[p.id]!=null)).map(t=>t.id); }
function checkReveals(){
  if(ui.reveal||ui.dial) return; let seen; try{ seen=JSON.parse(localStorage.getItem("firepit-seen")||"null"); }catch(e){ seen=null; }
  const done=completeIds();
  if(state.audit&&state.audit.active){ try{ localStorage.setItem("firepit-seen",JSON.stringify(done)); }catch(e){} return; }
  if(!seen){ try{ localStorage.setItem("firepit-seen",JSON.stringify(done)); }catch(e){} return; }
  const fresh=done.filter(id=>!seen.includes(id)); if(!fresh.length) return;
  ui.reveal=fresh[0]; try{ localStorage.setItem("firepit-seen",JSON.stringify([...seen,...fresh])); }catch(e){}
}
function renderReveal(t){
  const votes=state.votes[t.id]||{}; const vals=PLAYERS.map(p=>({id:p.id,name:p.name,v:votes[p.id].v})).sort((a,b)=>a.v-b.v);

function lifetime(){

  [...visibleArchive(),...liveArchive()].forEach(a=>{ archiveWinners(a).forEach(i=>{ if(s[i]) s[i].w++ }); archiveLosers(a).forEach(i=>{ if(s[i]) s[i].l++ }); if(a.kind==="pctv") Object.keys(a.guesses).forEach(i=>{ if(s[i]){ s[i].pts+=brier(a.guesses[i],a.outcome); s[i].n++; } }); });
  return s;
}
function yearStats(){
  const s=Object.fromEntries(PLAYERS.map(p=>[p.id,{out:0,cons:0,avg:[],locked:0}]));
  takesList().forEach(t=>{ const v=state.votes[t.id]||{}; PLAYERS.forEach(p=>{ if(v[p.id]) s[p.id].locked++; }); const vals=PLAYERS.filter(p=>v[p.id]).map(p=>({id:p.id,v:v[p.id].v})); if(vals.length<3) return; const med=median(vals.map(x=>x.v)); let mx=-1,mi=Infinity,o=null,c=null; vals.forEach(x=>{const d=Math.abs(x.v-med); if(d>mx){mx=d;o=x.id} if(d<mi){mi=d;c=x.id}}); if(mx>0) s[o].out++; s[c].cons++; if(t.kind==="pct") vals.forEach(x=>{s[x.id].avg.push(x.v)}); });

}

}

  if(played.length){ const nets=[...new Set(played.map(net))].sort((a,b)=>b-a); out.captain=played.filter(i=>net(i)===nets[0]); if(nets.length>1) out.assistant=played.filter(i=>net(i)===nets[1]); }

function parseCfg(txt){ const su=(txt.match(/https:\/\/[a-z0-9-]+\.supabase\.co/i)||[])[0]; const sk=(txt.match(/sb_publishable_[A-Za-z0-9_-]+|eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+/)||[])[0]; if(su&&sk) return {supabaseUrl:su,supabaseKey:sk}; const o={}; const re=/["']?([A-Za-z]+)["']?\s*:\s*["']([^"']*)["']/g; let m; while((m=re.exec(txt))) o[m[1]]=m[2]; return (o.apiKey&&o.databaseURL&&o.projectId)?o:null; }
function loadCfg(){
  try{ const h=location.hash.match(/cfg=([A-Za-z0-9+/=_-]+)/); if(h){ const c=parseCfg(atob(h[1].replace(/-/g,"+").replace(/_/g,"/"))); if(c){ localStorage.setItem("firepit-cfg",JSON.stringify(c)); history.replaceState(null,"",location.pathname+location.search); return c; } } }catch(e){}
  try{ const r=localStorage.getItem("firepit-cfg"); if(r) return JSON.parse(r); }catch(e){}
  return SUPABASE_CONFIG||FIREBASE_CONFIG;
}
function shareLink(){ const baked=(SUPABASE_CONFIG&&JSON.stringify(CFG)===JSON.stringify(SUPABASE_CONFIG))||(FIREBASE_CONFIG&&JSON.stringify(CFG)===JSON.stringify(FIREBASE_CONFIG)); const c=CFG&&!baked?btoa(JSON.stringify(CFG)):""; return location.origin+location.pathname+(c?"#cfg="+c:""); }
function saveCfg(){ const c=parseCfg(document.getElementById("cfgin").value||""); if(!c){toast("Need a Supabase URL + key, or a Firebase config block");return;} try{localStorage.setItem("firepit-cfg",JSON.stringify(c))}catch(e){} location.reload(); }
function clearCfg(){ try{localStorage.removeItem("firepit-cfg")}catch(e){} location.reload(); }

  function puppets(t,dt){

  function fit(c){ const dpr=Math.min(2,devicePixelRatio||1); const w=c.clientWidth, h=c.clientHeight; if(c.width!==Math.round(w*dpr)||c.height!==Math.round(h*dpr)){ c.width=Math.round(w*dpr); c.height=Math.round(h*dpr); } return dpr; }
  function drawVU(fig,level){
    const c=fig.querySelector("canvas"), dpr=fit(c), ctx=c.getContext("2d"), W=c.width, H=c.height;
    ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,W,H);
    const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,"#efe2c6"); g.addColorStop(1,"#d6c39d");
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    const px=W/2, py=H*1.08, R=H*0.86, a0=-Math.PI/2-0.78, a1=-Math.PI/2+0.78, red=0.72, tiny=H<44*dpr;
    const ang=k=>a0+(a1-a0)*k;
    ctx.lineCap="butt";
    ctx.beginPath(); ctx.arc(px,py,R,a0,ang(red)); ctx.strokeStyle="#1d1712"; ctx.lineWidth=2*dpr; ctx.stroke();
    ctx.beginPath(); ctx.arc(px,py,R,ang(red),a1); ctx.strokeStyle="#c9372c"; ctx.lineWidth=4*dpr; ctx.stroke();
    const marks=[[0,"-20"],[.25,"-10"],[.36,"-7"],[.46,"-5"],[.57,"-3"],[.66,"-1"],[.72,"0"],[.8,"+1"],[.88,"+2"],[.97,"+3"]];
    ctx.font=`${Math.round(H*0.11)}px "Barlow Condensed", Arial, sans-serif`; ctx.textAlign="center"; ctx.textBaseline="middle";
    for(const [k,l] of marks){
      const a=ang(k), big=l.length<3||l==="-20"||l==="-10", r1=R-(big?9:5)*dpr;
      ctx.beginPath(); ctx.moveTo(px+Math.cos(a)*r1,py+Math.sin(a)*r1); ctx.lineTo(px+Math.cos(a)*(R-1*dpr),py+Math.sin(a)*(R-1*dpr));
      ctx.strokeStyle=k>=red?"#c9372c":"#1d1712"; ctx.lineWidth=(big?1.6:1)*dpr; ctx.stroke();
      if(big&&!tiny){ ctx.fillStyle=k>=red?"#c9372c":"#2b231b"; ctx.fillText(l,px+Math.cos(a)*(R-18*dpr),py+Math.sin(a)*(R-18*dpr)); }
    }
    ctx.font=`${Math.round(H*0.2)}px "Bebas Neue","Barlow Condensed",Impact,sans-serif`; ctx.fillStyle="#2b231b"; ctx.fillText("VU",px,H*0.62);
    if(!tiny){ ctx.font=`${Math.round(H*0.085)}px "Barlow Condensed", Arial, sans-serif`; ctx.fillStyle="#7a6a55"; ctx.fillText("COLPOY'S BROADCASTING",px,H*0.78); }
    const k=Math.pow(level,0.7), a=ang(k);
    ctx.save(); ctx.shadowColor="rgba(0,0,0,.35)"; ctx.shadowBlur=3*dpr; ctx.shadowOffsetY=1.5*dpr;
    ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(px+Math.cos(a)*R*1.02,py+Math.sin(a)*R*1.02); ctx.strokeStyle="#151009"; ctx.lineWidth=1.6*dpr; ctx.lineCap="round"; ctx.stroke(); ctx.restore();
    ctx.beginPath(); ctx.arc(px,py,H*0.14,0,Math.PI*2); ctx.fillStyle="#1d1712"; ctx.fill();

    ctx.strokeStyle="rgba(0,0,0,.35)"; ctx.lineWidth=2*dpr; ctx.strokeRect(1*dpr,1*dpr,W-2*dpr,H-2*dpr);

  function html(){ return `<div class="booth" id="booth">${sceneSvg()}<figure class="vu l" id="vu-host" style="--c:var(--gold)"><canvas></canvas><figcaption><i></i><span>Mic 1</span></figcaption></figure><figure class="vu r" id="vu-colour" style="--c:var(--ember)"><canvas></canvas><figcaption><i></i><span>Mic 2</span></figcaption></figure></div>`; }
  function caption(){ return `<div class="bcap" id="bcap"><span class="tag" id="bcap-tag">Booth</span><p id="bcap-line" data-i="-1">Cueing the tape…</p><button class="snd" id="bcap-snd" onclick="BOOTH.unmute()" hidden aria-label="Sound on this phone">🔊</button></div>`; }
  const player=new Audio(); player.preload="auto";
  player.addEventListener("ended",()=>{ ended=true; speaking=null; });
  async function load(id){
    if(cache[id]) return cache[id];
    const r=await fetch("audio/"+id+".json"); if(!r.ok) throw new Error("no clip "+id);
    const j=await r.json();
    const lines=j.lines.map(l=>({w:SPKR[l.speaker]||"host",t:l.text,hl:l.hl||[],reveal:!!l.reveal,final:!!l.final,start:l.start,end:l.end,wt:l.wt||null}));
    return cache[id]={id,src:"audio/"+id+".mp3",duration:j.duration,lines,env:j.env||null,envHz:j.env_hz||50};
  }
  function now(){ if(!run) return 0; return mode==="local"?player.currentTime:Math.max(0,(Date.now()+SERVER_OFFSET-run.at)/1000); }
  function level(){ if(!clip||!clip.env||ended) return 0; if(mode==="local"&&player.paused) return 0; const k=Math.floor(now()*clip.envHz); return k<clip.env.length?clip.env[k]:0; }
  function stop(){ run=null; clip=null; speaking=null; lineIdx=-1; ended=false; live=0; try{ player.pause(); }catch(e){} env.host=env.colour=0; }
  // show = {clip, at, idx}. Every phone follows the shared start time; the phone that cued it (or one that tapped 🔊) also voices it.
  async function sync(show, local){
    if(!show||!show.clip||!BOOTH_CLIPS.has(show.clip)){ if(run) stop(); return; }
    if(run&&run.at===show.at&&run.clip===show.clip){ tick(); return; }
    stop(); run={clip:show.clip,at:show.at};
    let c; try{ c=await load(show.clip); }catch(e){ run=null; return; }
    if(!run||run.at!==show.at) return;
    clip=c; lineIdx=-1; speaking=null; ended=false;
    const t=Math.max(0,(Date.now()+SERVER_OFFSET-show.at)/1000);
    mode=(local||ui.boothSound)?"local":"clock";
    if(t>=c.duration){ ended=true; mode="clock"; }
    else if(mode==="local"){ player.src=c.src; player.currentTime=t>0.5?t:0; player.play().catch(()=>{ mode="clock"; }); }
    if(!raf) raf=requestAnimationFrame(step);
  }
  function unmute(){ if(!clip||!run||ended) return; ui.boothSound=true; if(mode==="local") return; const t=now(); mode="local"; player.src=clip.src; player.currentTime=t; player.play().catch(()=>{ mode="clock"; }); }
  function step(){ raf=0; if(!run) return; tick(); raf=requestAnimationFrame(step); }
  function tick(){
    if(!clip) return;
    const t=now(), L=clip.lines, lineEl=document.getElementById("bcap-line");
    if(!ended&&mode==="clock"&&t>=clip.duration){ ended=true; speaking=null; }
    let i=lineIdx; if(i<0||t<L[i].start||t>=L[i].end){ i=L.findIndex(l=>t>=l.start&&t<l.end); if(i<0&&t>=L[L.length-1].end) i=L.length-1; }
    if(i>=0&&(i!==lineIdx||(lineEl&&lineEl.dataset.i!==String(i)))){ lineIdx=i; showLine(L[i],i); }
    if(!ended&&i>=0) speaking=L[i].w;
    live=level();
    const snd=document.getElementById("bcap-snd"); if(snd) snd.hidden=mode==="local"||ended;
    for(const ch of ["host","colour"]){ const tg=speaking===ch?live:0; const k=tg>env[ch]?0.6:0.3; env[ch]+=(tg-env[ch])*(reduced?1:k); }
    karaoke();
    if(!document.getElementById("booth")) return;
    puppets(performance.now()/1000);
    const vh=document.getElementById("vu-host"), vc=document.getElementById("vu-colour");
    if(vh){ drawVU(vh,env.host); vh.classList.toggle("talk",speaking==="host"); }
    if(vc){ drawVU(vc,env.colour); vc.classList.toggle("talk",speaking==="colour"); }
  }
  function karaoke(){
    // how far through the current line the voice is, by loudness so pauses don't advance the words
    const line=document.getElementById("bcap-line"); if(!line||lineIdx<0||!clip) return;
    const l=clip.lines[lineIdx], spans=line.querySelectorAll("span"); if(!spans.length) return;
    const t=now(); let p;
    if(l.wt&&l.wt.length===spans.length){ let c=0; for(const w of l.wt){ if(w[0]<=t+0.05) c++; } p=c/spans.length; }
    else if(clip.env){ const hz=clip.envHz, k0=Math.floor(l.start*hz), k1=Math.min(clip.env.length,Math.ceil(l.end*hz)), kt=Math.min(k1,Math.floor(t*hz)); let tot=0,acc=0; for(let k=k0;k<k1;k++){ const v=clip.env[k]; tot+=v; if(k<kt) acc+=v; } p=tot>0?acc/tot:(t-l.start)/Math.max(0.1,l.end-l.start); }
    else p=(t-l.start)/Math.max(0.1,l.end-l.start);
    if(ended||t>=l.end) p=1;
    const n=Math.max(0,Math.min(spans.length,Math.round(p*spans.length)));
    spans.forEach((sp,k)=>sp.classList.toggle("said",k<n));
    const cur=spans[Math.max(0,n-1)]; const lh=parseFloat(getComputedStyle(line).lineHeight)||20; const row=Math.round(cur.offsetTop/lh);
    const want=Math.max(0,row-1)*lh; if(Math.abs(line.scrollTop-want)>1) line.scrollTop=want;
  }
  function showLine(l,i){
    const tag=document.getElementById("bcap-tag"), line=document.getElementById("bcap-line");
    if(tag){ tag.textContent=l.w==="host"?"Hayes":"O'Dog"; tag.style.setProperty("--c",l.w==="host"?"var(--gold)":"var(--ember)"); }
    if(line){ line.innerHTML=l.t.split(" ").map(w=>`<span>${esc(w)}</span>`).join(" "); line.dataset.i=String(i); line.scrollTop=0; }
    document.querySelectorAll(".torch.hot, .pk.hot, .gl .g.hot").forEach(e=>{ e.classList.remove("hot"); e.style.boxShadow=""; });
    (l.hl||[]).forEach(pid=>{ document.querySelectorAll(`.aud #torch-${pid}, .aud #pk-${pid}, .bov .gl .g[data-p="${pid}"]`).forEach(e=>{ e.classList.add("hot"); e.style.boxShadow=`0 0 0 1px ${PC[pid]}, 0 0 18px -4px ${PC[pid]}`; }); });
    if(onLine&&clip) try{ onLine(l,i,clip.id,mode); }catch(e){}
  }
  return {html,caption,sync,stop,unmute,running:()=>!!run,ended:()=>ended,has:id=>BOOTH_CLIPS.has(id),hook:f=>{ onLine=f; },clipId:()=>clip&&clip.id,mode:()=>mode};
})();
function boothCue(clipId){ const a=state.audit; if(!a||!a.active) return; const at=Date.now()+SERVER_OFFSET; ui.boothAt=at; sync.set("audit/show",{clip:clipId,at,idx:a.idx}); }
function openBooth(id){ if(!BOOTH.has(id)) return; ui.booth=id; ui.boothAt=Date.now()+SERVER_OFFSET; render(); }
function closeBooth(){ ui.booth=null; BOOTH.stop(); render(); }
function replayBooth(){ if(!ui.booth) return; ui.boothAt=Date.now()+SERVER_OFFSET; BOOTH.sync({clip:ui.booth,at:ui.boothAt},true); }
function renderBooth(id){
  const a=ARCHIVE.find(x=>x.id===id); if(!a||isSealed(a)) return "";
  return `<div class="bov" id="bov"><div class="top"><span class="ttl">The Firepit Hour · ${a.year}</span><span class="cnt">The call</span><button class="x" onclick="closeBooth()" aria-label="Close">×</button></div>
  <div class="body">${BOOTH.html()}${BOOTH.caption()}<div class="bcard">${renderArchiveItem(a)}</div></div>
  <div class="row"><button class="btn gold" style="flex:1" onclick="replayBooth()">Play it again</button><button class="btn ghost" onclick="closeBooth()">Close</button></div></div>`;
}

const CFG=loadCfg();
if(CFG&&CFG.supabaseUrl){ mode="supabase"; sync=makeSupabaseSync(); } else if(CFG){ mode="firebase"; sync=makeFirebaseSync(); } else { sync=makeLocalSync(); }
sync.start();
</script>
